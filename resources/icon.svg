    <rect x="150" y="215" width="70" height="26" rx="5"/><rect x="150" y="275" width="70" height="26" rx="5"/>
    <rect x="150" y="335" width="70" height="26" rx="5"/><rect x="150" y="395" width="70" height="26" rx="5"/>
    <rect x="150" y="455" width="70" height="26" rx="5"/><rect x="150" y="515" width="70" height="26" rx="5"/>
    <rect x="150" y="575" width="70" height="26" rx="5"/><rect x="150" y="635" width="70" height="26" rx="5"/>
    <rect x="804" y="215" width="70" height="26" rx="5"/><rect x="804" y="275" width="70" height="26" rx="5"/>
    <rect x="804" y="335" width="70" height="26" rx="5"/><rect x="804" y="395" width="70" height="26" rx="5"/>
  </g>
  <!-- Boîtier de la puce -->
  <rect x="210" y="170" width="604" height="520" rx="34" fill="#1b1c20" stroke="#3a3d45" stroke-width="10"/>
