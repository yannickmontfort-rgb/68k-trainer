    <rect x="40" y="-120" width="100" height="70" rx="12" fill="#2a2c31" stroke="#0b0c0e" stroke-width="6" transform="rotate(22 90 -85)"/>
    <path d="M 150 -120 C 190 -190, 250 -190, 270 -240" fill="none" stroke="#d9b36a" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(272 -246)">
