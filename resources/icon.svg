  <text x="512" y="400" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="150" font-weight="700" fill="#f2f2f2">68000</text>
  <text x="512" y="480" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="64" fill="#8ea6d6">TRAINER</text>
  <!-- La bombe du ST -->
  <g transform="translate(640 650) scale(0.72)">
