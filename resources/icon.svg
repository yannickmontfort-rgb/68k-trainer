      <stop offset="0" stop-color="#2b5bb5"/>
      <stop offset="1" stop-color="#132a57"/>
    </linearGradient>
    <radialGradient id="bombe" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6b6f78"/>
      <stop offset="0.45" stop-color="#25272c"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </radialGradient>
  </defs>
  <!-- Fond arrondi -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#fond)"/>
  <!-- Pattes de la puce (DIP 64 broches, stylisé) -->
